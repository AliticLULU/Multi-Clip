<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MemoClip</title>
<style>
/* ===== Reset & Variables ===== */
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --bg: #f0f2f5;
  --surface: #ffffff;
  --primary: #4f6ef7;
  --primary-hover: #3b5de7;
  --primary-light: #eef1ff;
  --text: #1e293b;
  --text-secondary: #64748b;
  --border: #e2e8f0;
  --danger: #ef4444;
  --danger-hover: #dc2626;
  --danger-light: #fef2f2;
  --radius: 10px;
  --radius-sm: 6px;
  --shadow: 0 1px 3px rgba(0,0,0,.06), 0 1px 2px rgba(0,0,0,.04);
  --shadow-lg: 0 10px 40px rgba(0,0,0,.12);
  --transition: 150ms ease;
}

body {
  font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
  background: var(--bg);
  color: var(--text);
  min-height: 100vh;
  display: flex;
  justify-content: center;
  padding: 40px 16px;
}

/* ===== App Container ===== */
.app {
  width: 100%;
  max-width: 680px;
  display: flex;
  flex-direction: column;
  gap: 16px;
}

/* ===== Header ===== */
.header {
  display: flex;
  align-items: center;
  gap: 12px;
}
.header .logo {
  width: 38px; height: 38px;
  background: var(--primary);
  border-radius: var(--radius-sm);
  display: flex; align-items: center; justify-content: center;
  font-size: 20px;
}
.header h1 {
  font-size: 22px;
  font-weight: 700;
  letter-spacing: -0.3px;
}
.header .count {
  margin-left: auto;
  font-size: 13px;
  color: var(--text-secondary);
  background: var(--surface);
  padding: 5px 12px;
  border-radius: 20px;
  border: 1px solid var(--border);
}

/* ===== Search Bar ===== */
.search-bar {
  display: flex;
  gap: 10px;
}
.search-bar .input-wrap {
  flex: 1;
  position: relative;
}
.search-bar .icon {
  position: absolute;
  left: 14px; top: 50%;
  transform: translateY(-50%);
  font-size: 15px;
  color: var(--text-secondary);
  pointer-events: none;
}
.search-bar input {
  width: 100%;
  height: 44px;
  padding: 0 14px 0 38px;
  border: 1px solid var(--border);
  border-radius: var(--radius);
  font-size: 14px;
  background: var(--surface);
  color: var(--text);
  outline: none;
  transition: border var(--transition), box-shadow var(--transition);
}
.search-bar input:focus {
  border-color: var(--primary);
  box-shadow: 0 0 0 3px rgba(79,110,247,.12);
}
.search-bar input::placeholder { color: #94a3b8; }

.btn {
  height: 44px;
  padding: 0 20px;
  border: none;
  border-radius: var(--radius);
  font-size: 14px;
  font-weight: 600;
  cursor: pointer;
  white-space: nowrap;
  transition: background var(--transition), transform var(--transition), box-shadow var(--transition);
  display: flex; align-items: center; gap: 6px;
}
.btn:active { transform: scale(0.97); }
.btn-primary {
  background: var(--primary);
  color: #fff;
}
.btn-primary:hover { background: var(--primary-hover); box-shadow: 0 4px 12px rgba(79,110,247,.3); }
.btn-outline {
  background: var(--surface);
  color: var(--text);
  border: 1px solid var(--border);
}
.btn-outline:hover { background: #f8fafc; border-color: #cbd5e1; }
.btn-danger {
  background: var(--surface);
  color: var(--danger);
  border: 1px solid var(--border);
}
.btn-danger:hover { background: var(--danger-light); border-color: var(--danger); }

/* ===== Table ===== */
.table-wrap {
  background: var(--surface);
  border-radius: var(--radius);
  border: 1px solid var(--border);
  overflow: hidden;
  box-shadow: var(--shadow);
}
.table-wrap table {
  width: 100%;
  border-collapse: collapse;
  table-layout: fixed;
}
.table-wrap th {
  text-align: left;
  padding: 12px 16px;
  font-size: 11px;
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: 0.5px;
  color: var(--text-secondary);
  background: #f8fafc;
  border-bottom: 1px solid var(--border);
}
.table-wrap th:first-child { width: 35%; }
.table-wrap td {
  padding: 12px 16px;
  font-size: 13.5px;
  border-bottom: 1px solid #f1f5f9;
  vertical-align: top;
}
.table-wrap tr:last-child td { border-bottom: none; }
.table-wrap tr:hover td { background: #fafbff; }
.table-wrap .key-cell {
  font-weight: 600;
  color: var(--text);
  word-break: break-all;
}
.table-wrap .val-cell {
  color: var(--text-secondary);
  font-family: 'Consolas', 'Cascadia Code', 'Fira Code', monospace;
  font-size: 12.5px;
  word-break: break-all;
  white-space: pre-wrap;
}
.table-wrap .actions-cell {
  width: 80px;
  text-align: right;
  white-space: nowrap;
}
.icon-btn {
  display: inline-flex;
  align-items: center; justify-content: center;
  width: 32px; height: 32px;
  border: 1px solid var(--border);
  border-radius: var(--radius-sm);
  background: var(--surface);
  cursor: pointer;
  font-size: 14px;
  color: var(--text-secondary);
  transition: all var(--transition);
}
.icon-btn:hover { background: #f1f5f9; color: var(--text); border-color: #cbd5e1; }
.icon-btn.danger:hover { background: var(--danger-light); color: var(--danger); border-color: var(--danger); }

/* ===== Empty State ===== */
.empty {
  text-align: center;
  padding: 48px 24px;
  color: var(--text-secondary);
}
.empty .empty-icon { font-size: 48px; margin-bottom: 12px; }
.empty h3 { font-size: 16px; font-weight: 600; color: var(--text); margin-bottom: 6px; }
.empty p { font-size: 13px; line-height: 1.5; }

/* ===== Modal ===== */
.modal-overlay {
  position: fixed;
  inset: 0;
  background: rgba(15,23,42,.45);
  backdrop-filter: blur(2px);
  display: flex;
  align-items: center; justify-content: center;
  z-index: 1000;
  animation: fadeIn 150ms ease;
}
@keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
@keyframes slideUp { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: translateY(0); } }

.modal {
  background: var(--surface);
  border-radius: 14px;
  width: 90%;
  max-width: 480px;
  box-shadow: var(--shadow-lg);
  animation: slideUp 200ms ease;
  overflow: hidden;
}
.modal-header {
  padding: 18px 20px;
  border-bottom: 1px solid var(--border);
  display: flex; align-items: center; justify-content: space-between;
}
.modal-header h2 { font-size: 17px; font-weight: 700; }
.modal-close {
  width: 32px; height: 32px;
  border: none; background: none;
  font-size: 20px; cursor: pointer;
  color: var(--text-secondary);
  border-radius: var(--radius-sm);
  display: flex; align-items: center; justify-content: center;
}
.modal-close:hover { background: #f1f5f9; }
.modal-body { padding: 20px; display: flex; flex-direction: column; gap: 14px; }
.modal-body label {
  font-size: 13px; font-weight: 600; color: var(--text-secondary);
  text-transform: uppercase; letter-spacing: 0.4px;
}
.modal-body input, .modal-body textarea {
  width: 100%;
  padding: 10px 14px;
  border: 1px solid var(--border);
  border-radius: var(--radius-sm);
  font-size: 14px;
  font-family: inherit;
  outline: none;
  transition: border var(--transition), box-shadow var(--transition);
  resize: vertical;
}
.modal-body input:focus, .modal-body textarea:focus {
  border-color: var(--primary);
  box-shadow: 0 0 0 3px rgba(79,110,247,.1);
}
.modal-body textarea { min-height: 100px; font-family: 'Consolas', monospace; font-size: 13px; }
.modal-footer {
  padding: 14px 20px;
  border-top: 1px solid var(--border);
  display: flex; justify-content: flex-end; gap: 8px;
}
.modal-footer .btn { height: 38px; }

/* ===== Toast ===== */
.toast {
  position: fixed;
  bottom: 24px;
  left: 50%;
  transform: translateX(-50%);
  background: #1e293b;
  color: #fff;
  padding: 10px 20px;
  border-radius: 20px;
  font-size: 13px;
  font-weight: 500;
  z-index: 2000;
  animation: slideUp 200ms ease;
  pointer-events: none;
}
.toast.fadeout { animation: fadeOut 300ms ease forwards; }
@keyframes fadeOut { to { opacity: 0; transform: translateX(-50%) translateY(8px); } }
</style>
</head>
<body>
<div class="app">
  <!-- Header -->
  <div class="header">
    <div class="logo">📝</div>
    <h1>MemoClip</h1>
    <span class="count" id="count">0 memos</span>
  </div>

  <!-- Search -->
  <div class="search-bar">
    <div class="input-wrap">
      <span class="icon">🔍</span>
      <input type="text" id="search" placeholder="Search memos..." autofocus>
    </div>
    <button class="btn btn-primary" onclick="openAddModal()" id="btn-add">➕ Add</button>
    <button class="btn btn-outline" onclick="openEditModal()" id="btn-edit">✎ Edit</button>
    <button class="btn btn-danger" onclick="deleteSelected()" id="btn-del">✕ Del</button>
  </div>

  <!-- Table -->
  <div class="table-wrap" id="table-wrap">
    <table id="table">
      <thead><tr><th>Key</th><th>Value</th><th></th></tr></thead>
      <tbody id="tbody"></tbody>
    </table>
    <div class="empty" id="empty">
      <div class="empty-icon">📋</div>
      <h3>No memos yet</h3>
      <p>Click <strong>➕ Add</strong> or press <kbd>Ctrl+N</kbd> to create your first memo</p>
    </div>
  </div>

  <!-- Modal Overlay (hidden by default) -->
  <div class="modal-overlay" id="modal-overlay" style="display:none;">
    <div class="modal">
      <div class="modal-header">
        <h2 id="modal-title">Add Memo</h2>
        <button class="modal-close" onclick="closeModal()">×</button>
      </div>
      <div class="modal-body">
        <div>
          <label for="modal-key">Key</label>
          <input type="text" id="modal-key" placeholder="e.g. deepseek密钥">
        </div>
        <div>
          <label for="modal-val">Value</label>
          <textarea id="modal-val" placeholder="e.g. sk-xxxxxxxxxxxxxxxx"></textarea>
        </div>
      </div>
      <div class="modal-footer">
        <button class="btn btn-outline" onclick="closeModal()">Cancel</button>
        <button class="btn btn-primary" onclick="saveModal()" id="modal-save">Save</button>
      </div>
    </div>
  </div>
</div>

<script>
// ===== Data Store =====
const STORAGE_KEY = 'memoclip_memos';
let memos = [];
let editingIndex = -1;
let selectedIndex = -1;

function loadMemos() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    memos = raw ? JSON.parse(raw) : [];
    if (!Array.isArray(memos)) memos = [];
  } catch(e) { memos = []; }
}

function saveMemos() {
  localStorage.setItem(STORAGE_KEY, JSON.stringify(memos));
}

// ===== Render =====
function getFilter() {
  return (document.getElementById('search').value || '').trim().toLowerCase();
}

function render() {
  const filter = getFilter();
  const filtered = filter
    ? memos.filter((m,i) => {
        m._idx = i;
        return (m.k||'').toLowerCase().includes(filter) ||
               (m.v||'').toLowerCase().includes(filter);
      })
    : memos.map((m,i) => { m._idx = i; return m; });

  const tbody = document.getElementById('tbody');
  const empty = document.getElementById('empty');
  const table = document.getElementById('table');

  tbody.innerHTML = '';

  if (filtered.length === 0) {
    table.style.display = 'none';
    empty.style.display = '';
    if (memos.length === 0) {
      empty.querySelector('h3').textContent = 'No memos yet';
      empty.querySelector('p').innerHTML = 'Click <strong>➕ Add</strong> or press <kbd>Ctrl+N</kbd> to create your first memo';
    } else {
      empty.querySelector('h3').textContent = 'No matches';
      empty.querySelector('p').textContent = 'Try a different search term';
    }
  } else {
    table.style.display = '';
    empty.style.display = 'none';
    filtered.forEach(m => {
      const tr = document.createElement('tr');
      if (m._idx === selectedIndex) tr.classList.add('selected');

      const keyTd = document.createElement('td');
      keyTd.className = 'key-cell';
      keyTd.textContent = m.k;
      tr.appendChild(keyTd);

      const valTd = document.createElement('td');
      valTd.className = 'val-cell';
      valTd.textContent = m.v;
      tr.appendChild(valTd);

      const actTd = document.createElement('td');
      actTd.className = 'actions-cell';

      const editBtn = document.createElement('button');
      editBtn.className = 'icon-btn';
      editBtn.innerHTML = '✎';
      editBtn.title = 'Edit';
      editBtn.onclick = (e) => { e.stopPropagation(); selectRow(m._idx); openEditModal(); };
      actTd.appendChild(editBtn);

      const delBtn = document.createElement('button');
      delBtn.className = 'icon-btn danger';
      delBtn.innerHTML = '✕';
      delBtn.title = 'Delete';
      delBtn.onclick = (e) => { e.stopPropagation(); selectRow(m._idx); deleteSelected(); };
      actTd.appendChild(delBtn);

      tr.appendChild(actTd);

      tr.onclick = () => selectRow(m._idx);
      if (m._idx === selectedIndex) tr.style.background = 'var(--primary-light)';

      tbody.appendChild(tr);
    });
  }

  updateCount();
}

function selectRow(idx) {
  selectedIndex = idx;
  render();
}

function updateCount() {
  const filter = getFilter();
  const total = memos.length;
  const showing = filter
    ? memos.filter(m => (m.k||'').toLowerCase().includes(filter) || (m.v||'').toLowerCase().includes(filter)).length
    : total;
  const el = document.getElementById('count');
  if (filter && showing !== total) {
    el.textContent = showing + ' / ' + total + ' memo' + (total!==1?'s':'');
  } else {
    el.textContent = total + ' memo' + (total!==1?'s':'');
  }
}

// ===== Modal =====
function openAddModal() {
  editingIndex = -1;
  document.getElementById('modal-title').textContent = 'Add Memo';
  document.getElementById('modal-key').value = '';
  document.getElementById('modal-val').value = '';
  document.getElementById('modal-save').textContent = 'Save';
  document.getElementById('modal-overlay').style.display = '';
  document.getElementById('modal-key').focus();
}

function openEditModal() {
  if (selectedIndex < 0 || selectedIndex >= memos.length) {
    if (memos.length > 0) {
      toast('Please select a memo first (click on it)');
    }
    return;
  }
  editingIndex = selectedIndex;
  const m = memos[editingIndex];
  document.getElementById('modal-title').textContent = 'Edit Memo';
  document.getElementById('modal-key').value = m.k;
  document.getElementById('modal-val').value = m.v;
  document.getElementById('modal-save').textContent = 'Update';
  document.getElementById('modal-overlay').style.display = '';
  document.getElementById('modal-key').focus();
  document.getElementById('modal-key').select();
}

function closeModal() {
  document.getElementById('modal-overlay').style.display = 'none';
}

function saveModal() {
  const k = document.getElementById('modal-key').value.trim();
  const v = document.getElementById('modal-val').value;
  if (!k) {
    toast('Key cannot be empty');
    document.getElementById('modal-key').focus();
    return;
  }
  if (editingIndex >= 0) {
    memos[editingIndex].k = k;
    memos[editingIndex].v = v;
    selectedIndex = editingIndex;
  } else {
    memos.push({ k, v });
    selectedIndex = memos.length - 1;
  }
  saveMemos();
  closeModal();
  render();
  toast(editingIndex >= 0 ? 'Memo updated' : 'Memo added');
}

function deleteSelected() {
  if (selectedIndex < 0 || selectedIndex >= memos.length) {
    if (memos.length > 0) {
      toast('Please select a memo first (click on it)');
    }
    return;
  }
  const m = memos[selectedIndex];
  const keyPreview = m.k.length > 40 ? m.k.substring(0,40)+'...' : m.k;
  if (confirm('Delete memo "' + keyPreview + '"?\n\nThis cannot be undone.')) {
    memos.splice(selectedIndex, 1);
    if (selectedIndex >= memos.length) selectedIndex = Math.max(0, memos.length - 1);
    saveMemos();
    render();
    toast('Memo deleted');
  }
}

// ===== Toast =====
function toast(msg) {
  const existing = document.querySelector('.toast');
  if (existing) existing.remove();
  const el = document.createElement('div');
  el.className = 'toast';
  el.textContent = msg;
  document.body.appendChild(el);
  setTimeout(() => {
    el.classList.add('fadeout');
    setTimeout(() => el.remove(), 300);
  }, 1800);
}

// ===== Keyboard shortcuts =====
document.addEventListener('keydown', function(e) {
  if (e.ctrlKey && e.key === 'n') {
    e.preventDefault();
    openAddModal();
  } else if (e.ctrlKey && e.key === 'f') {
    e.preventDefault();
    document.getElementById('search').focus();
    document.getElementById('search').select();
  } else if (e.key === 'Escape') {
    if (document.getElementById('modal-overlay').style.display !== 'none') {
      closeModal();
    } else {
      document.getElementById('search').focus();
    }
    selectedIndex = -1;
    render();
  } else if (e.key === 'ArrowDown') {
    e.preventDefault();
    const filter = getFilter();
    const filtered = filter
      ? memos.map((m,i) => ({...m,_idx:i})).filter(m => (m.k||'').toLowerCase().includes(filter) || (m.v||'').toLowerCase().includes(filter))
      : memos.map((m,i) => ({...m,_idx:i}));
    if (filtered.length === 0) return;
    const cur = filtered.findIndex(m => m._idx === selectedIndex);
    const next = cur < 0 ? 0 : Math.min(cur + 1, filtered.length - 1);
    selectedIndex = filtered[next]._idx;
    render();
  } else if (e.key === 'ArrowUp') {
    e.preventDefault();
    const filter = getFilter();
    const filtered = filter
      ? memos.map((m,i) => ({...m,_idx:i})).filter(m => (m.k||'').toLowerCase().includes(filter) || (m.v||'').toLowerCase().includes(filter))
      : memos.map((m,i) => ({...m,_idx:i}));
    if (filtered.length === 0) return;
    const cur = filtered.findIndex(m => m._idx === selectedIndex);
    const next = cur < 0 ? filtered.length - 1 : Math.max(cur - 1, 0);
    selectedIndex = filtered[next]._idx;
    render();
  } else if (e.key === 'Delete' && document.activeElement === document.body) {
    deleteSelected();
  } else if (e.key === 'Enter' && document.activeElement === document.body && selectedIndex >= 0) {
    openEditModal();
  }
});

// Search input
document.getElementById('search').addEventListener('input', function() {
  selectedIndex = -1;
  render();
});

// Click overlay to close modal
document.getElementById('modal-overlay').addEventListener('click', function(e) {
  if (e.target === this) closeModal();
});

// ===== Init =====
loadMemos();
render();
</script>
</body>
</html>
